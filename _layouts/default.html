<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | 淳映 CHUN Films</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.6; color: #333; background: #fff; }
    a { color: inherit; text-decoration: none; }

    /* 頂部導覽列 */
    header { background: #111; color: #fff; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 1.3rem; font-weight: bold; }
    nav a { margin-left: 1.5rem; color: #ccc; }
    nav a:hover { color: #fff; }

    /* 頁面主要內容區域 */
    main { max-width: 800px; margin: 2.5rem auto; padding: 0 1.5rem; }

    /* 頁尾 */
    footer { text-align: center; padding: 2rem; border-top: 1px solid #eee; color: #888; font-size: 0.9rem; margin-top: 4rem; }
  </style>
</head>
<body>

  <header>
    <a href="{{ '/' | relative_url }}" class="logo">淳映 CHUN Films</a>
    <nav>
      <a href="{{ '/' | relative_url }}">首頁</a>
      <a href="{{ '/about.html' | relative_url }}">關於</a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    <p>&copy; 淳映 CHUN Films</p>
  </footer>

</body>
</html>

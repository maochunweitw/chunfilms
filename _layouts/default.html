---
layout: default
title: 淳映 CHUN Films
---

<div class="home">
  <h1 class="page-heading">最新動態</h1>

  <ul class="post-list" style="list-style: none; padding: 0;">
    {% for post in site.posts %}
      <li style="margin-bottom: 1.5rem;">
        <span class="post-meta" style="color: #666; font-size: 0.9rem;">{{ post.date | date: "%d %b, %Y" }}</span>
        <h2 style="margin-top: 0.2rem; font-size: 1.2rem;">
          <a class="post-link" href="{{ post.url | relative_url }}">{{ post.title | escape }}</a>
        </h2>
      </li>
    {% endfor %}
  </ul>
</div>

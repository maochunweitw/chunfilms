<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>淳映 CHUN Films</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      background: #ffffff;
      color: #222222;
      font-family: "Noto Serif TC", "Noto Serif CJK TC", "Songti TC",
                   "PMingLiU", "MingLiU", serif;
      min-height: 100vh;
    }

    .site {
      width: min(760px, calc(100% - 40px));
      min-height: 100vh;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: stretch;
      gap: 70px;
      padding: 50px 0;
    }

    .visual {
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: stretch;
    }

    .brand-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
    }

    .content {
      text-align: left;
    }

    .brand-name {
      margin: 0;
      font-size: 38px;
      font-weight: normal;
      letter-spacing: 0.12em;
    }

    .brand-en {
      margin: 8px 0 0;
      font-size: 20px;
      letter-spacing: 0.16em;
      font-weight: normal;
      color: #c00000;
    }

    .slogan {
      margin: 28px 0 48px;
      font-size: 17px;
      letter-spacing: 0.08em;
      line-height: 1.8;
    }

    nav {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 9px;
      line-height: 1.7;
    }

    nav a {
      color: #222222;
      text-decoration: none;
      font-size: 15px;
    }

    nav a:hover {
      text-decoration: underline;
    }

    footer {
      margin-top: 55px;
      font-size: 13px;
      color: #777777;
    }

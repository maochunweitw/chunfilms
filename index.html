---
layout: none
---

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 思源宋體／Noto Serif TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700&display=swap" rel="stylesheet">

  <title>淳映 CHUN Films</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      background: #ffffff;
      color: #222222;
      font-family: "Noto Serif TC", "Noto Serif CJK TC", "Songti TC",
                   "PMingLiU", "MingLiU", serif;
      min-height: 100vh;
    }

    .page {
      width: min(760px, calc(100% - 40px));
      margin: 0 auto;
      padding: 90px 0 70px;
    }

    h1 {
      margin: 0;
      font-size: 42px;
      font-weight: normal;
      letter-spacing: 0.12em;
    }

    .brand-en {
      margin: 8px 0 60px;
      font-size: 20px;
      letter-spacing: 0.16em;
      color: #c00000;
    }

    nav {
      margin: 0;
      padding: 0;
    }

    nav a {
      display: block;
      padding: 14px 0;
      border-bottom: 1px solid #dddddd;
      font-size: 20px;
      letter-spacing: 0.06em;
      color: #222222;
      text-decoration: none;
    }

    nav a:hover {
      text-decoration: underline;
    }

    footer {
      margin-top: 65px;
      font-size: 13px;
      color: #777777;
    }

    footer a {
      color: #777777;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 650px) {
      /* 手機版：全站強制宋體 */
      html, body, body *:not(code):not(pre) {
        font-family: "Noto Serif TC", "Noto Serif CJK TC", "Songti TC",
                     "STSong", "PMingLiU", "MingLiU", "SimSun", serif !important;
      }

      .page {
        width: calc(100% - 30px);
        padding: 60px 0 55px;
      }

      h1 {
        font-size: 34px;
      }

      .brand-en {
        margin-bottom: 45px;
      }

      nav a {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <h1>淳映</h1>
    <p class="brand-en">CHUN Films</p>

    <nav>
      <a href="{{ site.baseurl }}/blog/">最新 Latest</a>
      <a href="{{ site.baseurl }}/about.html">關於 About</a>
    </nav>

    <footer>
      Powered by
      <a href="https://pages.github.com/">GitHub Pages</a>
    </footer>

  </main>

</body>
</html>

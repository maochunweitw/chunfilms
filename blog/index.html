---
layout: none
---

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>最新 Latest｜淳映 CHUN Films</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      background: #ffffff;
      color: #222222;
      font-family: "Noto Serif TC", "Noto Serif CJK TC", "Songti TC",
                   "PMingLiU", "MingLiU", serif;
      min-height: 100vh;
    }

    .page {
      width: min(760px, calc(100% - 40px));
      margin: 0 auto;
      padding: 60px 0 70px;
    }

    .back {
      margin-bottom: 55px;
      font-size: 15px;
    }

    .back a {
      color: #222222;
      text-decoration: none;
    }

    .back a:hover {
      text-decoration: underline;
    }

    h1 {
      margin: 0;
      font-size: 38px;
      font-weight: normal;
      letter-spacing: 0.12em;
    }

    .brand-en {
      margin: 8px 0 50px;
      font-size: 20px;
      letter-spacing: 0.16em;
      color: #c00000;
    }

    .post-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .post-item {
      padding: 0 0 32px;
      margin: 0 0 32px;
      border-bottom: 1px solid #dddddd;
    }

    .post-date {
      margin: 0 0 12px;
      font-size: 14px;
      color: #777777;
      letter-spacing: 0.04em;
    }

    .post-title {
      margin: 0;
      font-size: 22px;
      font-weight: normal;
      line-height: 1.6;
      letter-spacing: 0.05em;
    }

    .post-title a {
      color: #222222;
      text-decoration: none;
    }

    .post-title a:hover {
      text-decoration: underline;
    }

    footer {
      margin-top: 65px;
      font-size: 13px;
      color: #777777;
    }

    footer a {
      color: #777777;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 650px) {
      .page {
        width: calc(100% - 30px);
        padding: 45px 0 55px;
      }

      .back {
        margin-bottom: 45px;
      }

      h1 {
        font-size: 34px;
      }

      .brand-en {
        margin-bottom: 42px;
      }

      .post-title {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="back">
      <a href="{{ site.baseurl }}/">← 首頁 Home</a>
    </div>

    <h1>最新</h1>

    <p class="brand-en">Latest</p>

    <ul class="post-list">
      {% for post in site.posts %}
        <li class="post-item">

          <p class="post-date">
            {{ post.date | date: "%d %b, %Y" }}
          </p>

          <h2 class="post-title">
            <a href="{{ post.url | relative_url }}">
              {{ post.title }}
            </a>
          </h2>

        </li>
      {% endfor %}
    </ul>

    <footer>
      Powered by
      <a href="https://pages.github.com/">GitHub Pages</a>
    </footer>

  </main>

</body>
</html>
